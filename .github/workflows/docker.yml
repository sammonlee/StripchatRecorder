name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ] # 当你在 main 或 master 分支提交代码时触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 / Checkout code
        uses: actions/checkout@v4

      - name: 登录 Docker Hub / Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 设置 Docker Buildx / Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像 / Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stripchat-recorder:latest
